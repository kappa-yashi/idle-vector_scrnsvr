name: build

# Runs ONLY when you ask it to, so ordinary commits cost no Actions minutes:
#   - "Run workflow" button (Actions tab): Windows build only by default, tick "linux" to add the Linux one
#   - pushing a tag like v0.1.0: Windows + Linux build, and a Release is created
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      linux:
        description: 'also build the Linux binary'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: host
        env:
          # link the C runtime statically: the .scr then needs no Visual C++ redistributable
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item host/target/release/kappayashi-saver.exe "dist/kappa.yashi.scr"
          Copy-Item host/target/release/kappayashi-saver.exe "dist/kappayashi-saver.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: kappayashi-saver-windows
          path: dist/*

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev
      - name: Build
        working-directory: host
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist
          cp host/target/release/kappayashi-saver dist/
      - uses: actions/upload-artifact@v4
        with:
          name: kappayashi-saver-linux
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
