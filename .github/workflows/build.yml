name: build

# Runs ONLY when you ask it to, so ordinary commits cost no Actions minutes:
#   - "Run workflow" button (Actions tab): Windows build only by default, tick "linux" to add the Linux one
#   - "Run workflow" with a release tag filled in (e.g. v0.1.0): Windows + Linux build, the tag and a Release are created
#   - pushing a tag like v0.1.0: same as above
#   A tag with a dash (v0.1.0-beta.1) becomes a pre-release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      linux:
        description: 'also build the Linux binary'
        type: boolean
        default: false
      release:
        description: 'publish as a Release with this tag, e.g. v0.1.0 or v0.1.0-beta.1 (empty = just build)'
        type: string
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: host
        env:
          # link the C runtime statically: the .scr then needs no Visual C++ redistributable
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $pkg = "kappayashi-saver-windows-x64"
          New-Item -ItemType Directory -Force $pkg, dist | Out-Null
          Copy-Item host/target/release/kappayashi-saver.exe "$pkg/kappa.yashi.scr"
          Copy-Item host/target/release/kappayashi-saver.exe "$pkg/kappayashi-saver.exe"
          Copy-Item DISCLAIMER.md, README.md $pkg
          Compress-Archive -Path "$pkg/*" -DestinationPath "dist/$pkg.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kappayashi-saver-windows
          path: dist/*

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.linux || inputs.release != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev
      - name: Build
        working-directory: host
        run: cargo build --release --locked
      - name: Package
        run: |
          pkg=kappayashi-saver-linux-x86_64
          mkdir -p $pkg dist
          cp host/target/release/kappayashi-saver linux/kappayashi-idle.sh DISCLAIMER.md README.md $pkg/
          chmod +x $pkg/kappayashi-saver $pkg/kappayashi-idle.sh
          tar -czf dist/$pkg.tar.gz $pkg
      - uses: actions/upload-artifact@v4
        with:
          name: kappayashi-saver-linux
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release || github.ref_name }}
          prerelease: ${{ contains(inputs.release || github.ref_name, '-') }}
          body: |
            **Windows:** `kappayashi-saver-windows-x64.zip` → unzip to a folder you keep → right-click `kappa.yashi.scr` → Install. Unsigned: SmartScreen → More info → Run anyway. Needs WebView2 (already in Windows 11 / updated Windows 10).
            **Linux:** `kappayashi-saver-linux-x86_64.tar.gz` → needs WebKitGTK 4.1 → `./kappayashi-saver --saver` (idle hook: see README).

            Free, provided "as is", no warranty, use at your own risk — see [DISCLAIMER.md](https://github.com/${{ github.repository }}/blob/main/DISCLAIMER.md). / Δωρεάν, «ως έχει», χρήση με δική σου ευθύνη.
